[project]
name = "simple-autoclicker"
version = "0.1.0"
description = "A simple autoclicker"
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Bartosz Zakrzewski", email = "bartoszzakrzewski@mti.edu.pl" },
]
keywords = ["autoclicker", "mouse", "automation", "learning", "python"]

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy"]
dev = ["ruff>=0.4.0", "pre-commit>=3.0"]

[project.urls]
homepage = "https://github.com/Mazowieckie-Technikum-Innowacji/prosty-autoclicker"
repository = "https://github.com/Mazowieckie-Technikum-Innowacji/prosty-autoclicker"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["click_platform*", "me*"]
exclude = ["manual_test*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "B905",
    "SIM108",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]


